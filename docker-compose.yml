services:
  db:
    image: postgres:15-alpine
    environment: {POSTGRES_DB: nascon, POSTGRES_USER: nascon, POSTGRES_PASSWORD: nascon123}
  backend:
    build: ./backend
    environment: {DB_HOST: db}
    depends_on: [db]
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
