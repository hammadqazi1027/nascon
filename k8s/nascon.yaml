apiVersion: v1
kind: Secret
metadata: {name: nascon-db}
stringData:
  DB_NAME: nascon
  DB_USER: nascon
  DB_PASSWORD: nascon123
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: db}
spec:
  replicas: 1
  selector: {matchLabels: {app: db}}
  template:
    metadata: {labels: {app: db}}
    spec:
      containers:
        - name: db
          image: postgres:15-alpine
          env:
            - {name: POSTGRES_DB, valueFrom: {secretKeyRef: {name: nascon-db, key: DB_NAME}}}
            - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: nascon-db, key: DB_USER}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: nascon-db, key: DB_PASSWORD}}}
          ports: [{containerPort: 5432}]
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: db}
spec:
  selector: {app: db}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backend}
spec:
  replicas: 2
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      containers:
        - name: backend
          image: DOCKERHUB_USER/nascon-backend:IMAGE_TAG
          envFrom: [{secretRef: {name: nascon-db}}]
          env: [{name: DB_HOST, value: db}]
          ports: [{containerPort: 5000}]
---
apiVersion: v1
kind: Service
metadata: {name: backend}
spec:
  selector: {app: backend}
  ports: [{port: 5000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: frontend
          image: DOCKERHUB_USER/nascon-frontend:IMAGE_TAG
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: frontend}
spec:
  type: NodePort
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 80, nodePort: 30080}]
